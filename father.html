<!doctype html>
<html lang=ar dir=rtl>
<head>

<title>فيصل اكاديمي بوابة أولياء الأمور-faissal Academy</title>
<link rel=preconnect href=https://fonts.googleapis.com>
<link rel=preconnect href=https://fonts.gstatic.com crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel=stylesheet>
<style>:root{--bg-color-1:#e0c3fc;--bg-color-2:#8ec5fc;--bg-color-3:#f3e7e9;--glass-bg:rgba(255, 255, 255, 0.65);--glass-border:rgba(255, 255, 255, 0.5);--text-main:#1d3557;--text-sub:#457b9d;--accent-color:#0077b6;--item-bg:rgba(255, 255, 255, 0.85);--item-hover:#ffffff;--shadow:0 8px 32px 0 rgba(31, 38, 135, 0.15)}[data-theme=dark]{--bg-color-1:#0f2027;--bg-color-2:#203a43;--bg-color-3:#2c5364;--glass-bg:rgba(15, 23, 42, 0.7);--glass-border:rgba(255, 255, 255, 0.1);--text-main:#f1faee;--text-sub:#a8dadc;--accent-color:#48cae4;--item-bg:rgba(30, 41, 59, 0.85);--item-hover:rgba(51, 65, 85, 1);--shadow:0 8px 32px 0 rgba(0, 0, 0, 0.6)}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:Tajawal,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(-45deg,var(--bg-color-1),var(--bg-color-2),var(--bg-color-3));background-size:400% 400%;animation:gradientBG 15s ease infinite;color:var(--text-main);transition:color .4s ease;overflow-x:hidden;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;padding:15px}@keyframes gradientBG{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}.shape{position:absolute;filter:blur(60px);z-index:-1;border-radius:50%;animation:float 10s infinite ease-in-out alternate}.shape-1{width:300px;height:300px;background:var(--accent-color);top:-50px;left:-50px;opacity:.3}.shape-2{width:400px;height:400px;background:var(--bg-color-1);bottom:-100px;right:-50px;opacity:.4;animation-delay:-5s}@keyframes float{100%{transform:translateY(30px) scale(1.1)}}.portal-container{background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:30px;padding:40px;width:100%;max-width:550px;box-shadow:var(--shadow);position:relative;transition:all .4s ease}.header-section{text-align:center;margin-bottom:35px}.icon-wrapper{width:75px;height:75px;background:var(--accent-color);border-radius:50%;display:flex;justify-content:center;align-items:center;margin:0 auto 15px auto;box-shadow:0 10px 20px rgba(0,0,0,.1)}.icon-wrapper svg{width:35px;height:35px;fill:#fff}.header-section h1{font-size:26px;font-weight:800;margin-bottom:10px;letter-spacing:-.5px}.header-section p{font-size:15px;font-weight:500;color:var(--text-sub);line-height:1.6}.services-wrapper{display:flex;flex-direction:column;gap:18px}.service-item{background:var(--item-bg);border-radius:20px;border:1px solid var(--glass-border);padding:18px;cursor:pointer;transition:all .3s ease;position:relative;overflow:hidden}.service-item:hover{background:var(--item-hover);transform:translateY(-3px);box-shadow:0 10px 25px rgba(0,0,0,.05)}.service-header{display:flex;align-items:center;gap:15px}.service-icon{font-size:26px;width:50px;height:50px;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.05);border-radius:15px;flex-shrink:0}[data-theme=dark] .service-icon{background:rgba(255,255,255,.1)}.service-title{font-size:18px;font-weight:700;flex-grow:1}.arrow-icon{transition:transform .3s ease;fill:var(--text-main);width:24px;height:24px;flex-shrink:0}.service-item.active .arrow-icon{transform:rotate(180deg)}.service-options{max-height:0;opacity:0;overflow:hidden;transition:all .4s cubic-bezier(0, 1, 0, 1);display:flex;gap:12px;margin-top:0}.service-item.active .service-options{max-height:250px;opacity:1;margin-top:20px;transition:all .4s cubic-bezier(1, 0, 1, 0)}.opt-btn{flex:1;background:var(--accent-color);color:#fff;border:none;padding:14px 10px;border-radius:12px;font-family:Tajawal,sans-serif;font-weight:700;font-size:15px;cursor:pointer;transition:all .3s ease;text-align:center}.opt-btn:active,.opt-btn:hover{filter:brightness(1.15);transform:scale(1.02)}.theme-switch-wrapper{position:absolute;top:25px;left:25px;display:flex;align-items:center;z-index:100}.theme-switch{display:inline-block;height:32px;position:relative;width:64px}.theme-switch input{display:none}.slider{background-color:rgba(0,0,0,.1);bottom:0;cursor:pointer;left:0;position:absolute;right:0;top:0;transition:.4s;border-radius:30px;border:1px solid var(--glass-border)}[data-theme=dark] .slider{background-color:rgba(255,255,255,.2)}.slider:before{background-color:#fff;bottom:4px;content:"";height:22px;left:5px;position:absolute;transition:.4s;width:22px;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,.2)}input:checked+.slider:before{transform:translateX(30px)}.mode-icon{position:absolute;top:7px;font-size:15px;z-index:1;pointer-events:none}.sun-icon{right:8px}.moon-icon{left:8px;opacity:0}input:checked~.sun-icon{opacity:0}input:checked~.moon-icon{opacity:1}@media (max-width:480px){.portal-container{padding:30px 20px;border-radius:25px;margin-top:30px}.theme-switch-wrapper{top:-45px;left:50%;transform:translateX(-50%)}.header-section h1{font-size:22px}.header-section p{font-size:14px}.service-title{font-size:17px}.service-options{flex-direction:column;gap:10px}.opt-btn{width:100%;padding:15px}}</style>
</head>
<body oncontextmenu=return!1>
<div class="shape shape-1"></div>
<div class="shape shape-2"></div>
<div class=portal-container>
<div class=theme-switch-wrapper>
<label class=theme-switch for=checkbox>
<input type=checkbox id=checkbox onchange=toggleTheme()>
<span class=slider></span>
<span class="mode-icon sun-icon">☀️</span>
<span class="mode-icon moon-icon">🌙</span>
</label>
</div>
<div class=header-section>
<div class=icon-wrapper>
<svg viewBox="0 0 24 24">
<path d="M12 3L1 9L4 10.63V17.5C4 19.43 7.58 21 12 21C16.42 21 20 19.43 20 17.5V10.63L23 9L12 3M12 5.33L19.67 9L12 12.67L4.33 9L12 5.33M6 12.27V17.5C6 18.57 8.69 20 12 20C15.31 20 18 18.57 18 17.5V12.27L12 15.5L6 12.27Z"/>
</svg>
</div>
<h1>بوابة أولياء الأمور</h1>
<p>لأننا نهتم بمستقبل أبنائكم، نضع بين أيديكم تقارير الأداء التفصيلية لحظة بلحظة.</p>
</div>
<div class=services-wrapper>
<div class=service-item id=attendance-section onclick='toggleSection("attendance-section")'>
<div class=service-header>
<div class=service-icon>📋</div>
<div class=service-title>متابعه الحضور والغياب</div>
<svg class=arrow-icon viewBox="0 0 24 24"><path d=M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z /></svg>
</div>
<div class=service-options onclick=event.stopPropagation()>
<button class=opt-btn onclick='openLink("attendance","1")'>الصف الثاني الثانوي</button>
<button class=opt-btn onclick='openLink("attendance","2")'>الصف الثالث الثانوي</button>
</div>
</div>
<div class=service-item id=grades-section onclick='toggleSection("grades-section")'>
<div class=service-header>
<div class=service-icon>📈</div>
<div class=service-title>متابعة الدرجات</div>
<svg class=arrow-icon viewBox="0 0 24 24"><path d=M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z /></svg>
</div>
<div class=service-options onclick=event.stopPropagation()>
<button class=opt-btn onclick='openLink("grades","1")'>الصف الثاني الثانوي</button>
<button class=opt-btn onclick='openLink("grades","2")'>الصف الثالث الثانوي</button>
</div>
</div>
</div>
</div>
<script>function toggleSection(e){const t=document.querySelectorAll(".service-item"),n=document.getElementById(e);t.forEach((t=>{t.id!==e&&t.classList.remove("active")})),n.classList.toggle("active")}function openLink(e,t){const n={attendance:{1:"https://www.mrfaisal.net/hdortanyasanwy",2:"https://www.mrfaisal.net/hdortalta"},grades:{1:"https://www.mrfaisal.net/ntigttanyathanwy",2:"https://www.mrfaisal.net/natigttaltathanwy"}}[e][t];n&&window.open(n,"_blank")}document.addEventListener("contextmenu",(function(e){e.preventDefault()})),document.addEventListener("keydown",(function(e){return"F12"===e.key||123===e.keyCode||e.ctrlKey&&e.shiftKey&&("I"===e.key||"i"===e.key||73===e.keyCode)||e.ctrlKey&&e.shiftKey&&("J"===e.key||"j"===e.key||74===e.keyCode)||e.ctrlKey&&e.shiftKey&&("C"===e.key||"c"===e.key||67===e.keyCode)?(e.preventDefault(),!1):!e.ctrlKey||"U"!==e.key&&"u"!==e.key&&85!==e.keyCode?void 0:(e.preventDefault(),!1)}));const checkbox=document.getElementById("checkbox");function toggleTheme(){checkbox.checked?(document.body.setAttribute("data-theme","dark"),localStorage.setItem("theme","dark")):(document.body.removeAttribute("data-theme"),localStorage.setItem("theme","light"))}"dark"===localStorage.getItem("theme")&&(document.body.setAttribute("data-theme","dark"),checkbox.checked=!0)</script>
</body>
</html>
