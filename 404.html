<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - الصفحة غير موجودة | www.mrfaisal.net</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b0f19 0%, #1a233a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .error-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px 30px;
            max-width: 580px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .site-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .error-code {
            font-size: 7.5rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

        .error-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #f3f4f6;
        }

        .error-desc {
            font-size: 1rem;
            color: #9ca3af;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 36px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
        }

        .btn-action:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(37, 99, 235, 0.5);
            color: #ffffff;
        }

        .btn-action i {
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .btn-action:hover i {
            transform: translateX(-4px);
        }

        .glow-sphere {
            position: absolute;
            width: 250px;
            height: 250px;
            background: #3b82f6;
            filter: blur(120px);
            opacity: 0.15;
            top: -50px;
            right: -50px;
            border-radius: 50%;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="glow-sphere"></div>

    <div class="error-card">
        <div class="site-badge">
            <i class="fa-solid fa-globe"></i>
            <span>www.mrfaisal.net</span>
        </div>

        <div class="error-code">404</div>

        <h1 class="error-title">عفواً، الصفحة المطلوبة غير متوفرة!</h1>
        <p class="error-desc">
            يبدو أنك اتبعت رابطاً خاطئاً أو تم حذف هذه الصفحة.<br>
            يمكنك العودة إلى حسابك والوصول إلى لوحتك الرئيسية من خلال الزر أدناه.
        </p>

        <a href="https://www.mrfaisal.net" class="btn-action">
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
            <span>توجه لحسابك</span>
        </a>
    </div>

</body>
</html>
