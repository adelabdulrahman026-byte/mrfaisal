<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة سناتر مستر محمد فيصل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95'
                        }
                    },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; }
        @media print { .no-print { display: none !important; } .print-area { display: block !important; } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <div id="admin-auth-gate" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl w-full max-w-md shadow-2xl relative">
            <div class="w-16 h-16 bg-brand-600/20 text-brand-400 rounded-2xl flex items-center justify-center mx-auto text-3xl mb-4">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-xl font-black text-center mb-1">لوحة تحكم مستر محمد فيصل</h2>
            <p class="text-xs text-gray-400 text-center mb-6">أهلاً بك يا مستر.. ادخل بيانات حسابك للمتابعة</p>

            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold mb-1">اسم المستخدم (Username):</label>
                    <input type="text" id="login-username" required placeholder="اسم المستخدم" class="w-full p-3.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-brand-600">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">كلمة المرور (Password):</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full p-3.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white focus:outline-none focus:border-brand-600">
                </div>
                <button type="submit" id="btn-login-submit" class="w-full py-3.5 bg-brand-700 hover:bg-brand-600 text-white font-black rounded-xl text-sm transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> دخول لوحة التحكم
                </button>
            </form>
            <p id="auth-error-msg" class="text-xs text-red-400 font-bold text-center mt-3 hidden"></p>
        </div>
    </div>

    <div id="edit-student-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 p-6 sm:p-8 rounded-3xl w-full max-w-2xl shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-5">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-lg font-bold">
                        <i class="fa-solid fa-user-pen"></i>
                    </div>
                    <div>
                        <h3 class="font-black text-lg text-white">تعديل بيانات الطالب</h3>
                        <p class="text-xs text-gray-400">تعديل الاسم أو الكود أو أرقام الهواتف وبيانات الاشتراك</p>
                    </div>
                </div>
                <button onclick="closeEditStudentModal()" class="text-gray-400 hover:text-white text-lg p-2">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form onsubmit="handleSaveEditedStudent(event)" class="space-y-4">
                <input type="hidden" id="edit-st-orig-id" value="">
                <input type="hidden" id="edit-st-orig-code" value="">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold mb-1 text-gray-300">اسم الطالب رباعي:</label>
                        <input type="text" id="edit-st-name" required placeholder="اسم الطالب" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1 text-brand-400">كود الطالب في السنتر (أرقام فقط):</label>
                        <input type="number" id="edit-st-code" required placeholder="مثال: 101" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-xs font-mono text-white focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1 text-gray-300">رقم تليفون الطالب:</label>
                        <input type="tel" id="edit-st-phone" required placeholder="01XXXXXXXXX" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white font-mono focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1 text-emerald-400">رقم تليفون ولي الأمر (للواتساب):</label>
                        <input type="tel" id="edit-st-parent-phone" required placeholder="01XXXXXXXXX" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white font-mono focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1 text-gray-300">السنة الدراسية:</label>
                        <select id="edit-st-grade" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white focus:outline-none">
                            <option value="الصف الثالث الثانوي">الصف الثالث الثانوي</option>
                            <option value="الصف الثاني الثانوي">الصف الثاني الثانوي</option>
                            <option value="الصف الأول الثانوي">الصف الأول الثانوي</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1 text-gray-300">السنتر / المجموعة:</label>
                        <select id="edit-st-center" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white focus:outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1 text-gray-300">نظام الدفع:</label>
                        <select id="edit-st-plan" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white focus:outline-none">
                            <option value="شهري">شهري (دفع كل شهر)</option>
                            <option value="بالحصة">بالحصة (دفع كل حصة)</option>
                            <option value="غير محدد">غير محدد</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1 text-gray-300">المبلغ المطلوب / المتبقي (ج.م):</label>
                        <input type="number" id="edit-st-balance" value="0" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-xs text-white focus:outline-none">
                    </div>
                </div>

                <div class="pt-4 flex gap-3">
                    <button type="submit" id="btn-save-edit-student" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl text-xs transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> حفظ وتحديث البيانات
                    </button>
                    <button type="button" onclick="closeEditStudentModal()" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-gray-300 font-bold rounded-xl text-xs transition">
                        إلغاء
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="admin-main-view" class="hidden">
        <header class="bg-slate-800/90 backdrop-blur-md border-b border-slate-700 sticky top-0 z-40 px-4 sm:px-8 py-4">
            <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-brand-700 flex items-center justify-center text-white font-bold">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <div>
                        <h1 class="font-black text-lg">منظومة سناتر مستر محمد فيصل</h1>
                        <p class="text-xs text-gray-400">مرحباً: <span id="logged-admin-name" class="font-bold text-amber-400">مستر فيصل</span> | الحصة النشطة: <span id="header-active-session-name" class="text-emerald-400 font-bold">لم تُحدد بعد</span></p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <span id="sync-status-badge" class="px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-bold rounded-full flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> متصل (Offline Ready)
                    </span>
                    <button onclick="logoutAdmin()" class="px-3 py-1.5 bg-red-950/60 hover:bg-red-900 border border-red-800 text-red-300 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                        <i class="fa-solid fa-power-off"></i> خروج
                    </button>
                </div>
            </div>
        </header>

        <div class="max-w-7xl mx-auto px-4 sm:px-8 py-8">
            <div class="flex items-center gap-2 overflow-x-auto pb-4 mb-6 border-b border-slate-800">
                <button onclick="switchTab('session-scan')" id="tab-btn-session-scan" class="tab-btn px-4 py-2.5 rounded-xl bg-brand-700 text-white font-black text-xs sm:text-sm whitespace-nowrap"><i class="fa-solid fa-camera ml-1"></i> حصة اليوم والماسح الذكي</button>
                <button onclick="switchTab('exams-desk')" id="tab-btn-exams-desk" class="tab-btn px-4 py-2.5 rounded-xl bg-slate-800 text-gray-300 font-bold text-xs sm:text-sm whitespace-nowrap"><i class="fa-solid fa-star ml-1"></i> تسجيل درجات الامتحانات</button>
                <button onclick="switchTab('absence-alert')" id="tab-btn-absence-alert" class="tab-btn px-4 py-2.5 rounded-xl bg-slate-800 text-gray-300 font-bold text-xs sm:text-sm whitespace-nowrap"><i class="fa-solid fa-user-xmark ml-1"></i> إبلاغ غياب الحصة</button>
                <button onclick="switchTab('students')" id="tab-btn-students" class="tab-btn px-4 py-2.5 rounded-xl bg-slate-800 text-gray-300 font-bold text-xs sm:text-sm whitespace-nowrap"><i class="fa-solid fa-user-plus ml-1"></i> الطلاب ورفع الإكسيل</button>
                <button onclick="switchTab('homework')" id="tab-btn-homework" class="tab-btn px-4 py-2.5 rounded-xl bg-slate-800 text-gray-300 font-bold text-xs sm:text-sm whitespace-nowrap"><i class="fa-solid fa-file-circle-plus ml-1"></i> إدارة وتعديل الواجبات</button>
                <button onclick="switchTab('broadcast')" id="tab-btn-broadcast" class="tab-btn px-4 py-2.5 rounded-xl bg-slate-800 text-gray-300 font-bold text-xs sm:text-sm whitespace-nowrap"><i class="fa-brands fa-whatsapp ml-1"></i> رسائل جماعية للسنتر</button>
                <button onclick="switchTab('centers')" id="tab-btn-centers" class="tab-btn px-4 py-2.5 rounded-xl bg-slate-800 text-gray-300 font-bold text-xs sm:text-sm whitespace-nowrap"><i class="fa-solid fa-map-location-dot ml-1"></i> إضافة السناتر</button>
                <button onclick="switchTab('reports')" id="tab-btn-reports" class="tab-btn px-4 py-2.5 rounded-xl bg-slate-800 text-gray-300 font-bold text-xs sm:text-sm whitespace-nowrap"><i class="fa-solid fa-file-invoice-dollar ml-1"></i> التقارير والماليات المفصلة</button>
                <button onclick="switchTab('api')" id="tab-btn-api" class="tab-btn px-4 py-2.5 rounded-xl bg-slate-800 text-gray-300 font-bold text-xs sm:text-sm whitespace-nowrap"><i class="fa-solid fa-sliders ml-1"></i> ربط WAPilot API</button>
            </div>

            <div id="tab-content-session-scan" class="tab-sec space-y-6">
                <div class="bg-slate-800/90 border border-slate-700 rounded-3xl p-6 shadow-md">
                    <h3 class="text-base font-black text-amber-400 mb-3 flex items-center gap-2"><i class="fa-solid fa-chalkboard-user"></i> تجهيز بيانات حصة اليوم ورقم الحصة والشهر</h3>
                    <form onsubmit="handleStartSession(event)" class="grid grid-cols-1 sm:grid-cols-5 gap-3 items-end">
                        <div>
                            <label class="block text-xs font-bold mb-1">السنتر:</label>
                            <select id="ses-center" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white" required></select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1">الصف الدراسي:</label>
                            <select id="ses-grade" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white" required>
                                <option value="الصف الثالث الثانوي">الصف الثالث الثانوي</option>
                                <option value="الصف الثاني الثانوي">الصف الثاني الثانوي</option>
                                <option value="الصف الأول الثانوي">الصف الأول الثانوي</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold mb-1">اسم / موضوع الحصة:</label>
                            <input type="text" id="ses-name" required placeholder="مثال: جغرافيا سياسية - مدخل" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[11px] font-bold mb-1 text-amber-300">رقم الحصة:</label>
                                <select id="ses-lesson-num" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white">
                                    <option value="الحصة 1">حصة 1</option>
                                    <option value="الحصة 2">حصة 2</option>
                                    <option value="الحصة 3">حصة 3</option>
                                    <option value="الحصة 4">حصة 4</option>
                                    <option value="الحصة 5">حصة 5</option>
                                    <option value="الحصة 6">حصة 6</option>
                                    <option value="الحصة 7">حصة 7</option>
                                    <option value="الحصة 8">حصة 8</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold mb-1 text-amber-300">الشهر:</label>
                                <select id="ses-month-num" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white">
                                    <option value="شهر 8 (أغسطس)">شهر 8</option>
                                    <option value="شهر 9 (سبتمبر)">شهر 9</option
